name: DEV navigation E2E
# Live check of the DEPLOYED DEV site: real web build, Search API, Routing API (Valhalla graph), tiles and MapLibre. Only the GPS is simulated
# (Playwright geolocation along the route geometry the real API returns). Manual: it wakes Render Free services and takes several minutes.
# This is "DEV navigation verified with simulated GPS" - it is not a physical-device test.
on:
  workflow_dispatch:
    inputs:
      web_url:
        description: 'Web URL to test'
        default: 'https://kunde-maps-web-dev.onrender.com'
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Live navigation E2E in the supported Playwright container
        env:
          WEB_URL: ${{ inputs.web_url }}
        run: |
          docker run --rm -e WEB_URL -e SHOTS=/work/shots \
            -v "$PWD:/work" -w /work \
            mcr.microsoft.com/playwright:v1.58.2-noble \
            bash -lc 'npm install --no-save --no-package-lock playwright@1.58.2 && node scripts/test-navigation-dev.js'
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-navigation-screenshots
          path: shots/
          if-no-files-found: ignore
          retention-days: 14
