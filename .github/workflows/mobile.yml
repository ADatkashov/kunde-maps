name: Mobile verification

on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'packages/kunde_maps_sdk/**'
      - 'apps/web/style*.json'
      - '.github/workflows/mobile*.yml'
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/kunde_maps_sdk/**'
      - 'apps/web/style*.json'
      - '.github/workflows/mobile*.yml'

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.50.1'

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Check mobile style against the canonical web style
        run: |
          cmp apps/web/style.json packages/kunde_maps_sdk/assets/style.json
          cmp apps/web/style-dark.json packages/kunde_maps_sdk/assets/style-dark.json
      - working-directory: apps/mobile
        run: |
          flutter pub get --enforce-lockfile
          dart format --output=none --set-exit-if-changed lib test integration_test
          flutter analyze
          flutter test
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Verify Android release compilation
        run: |
          flutter build apk --release
          git diff --exit-code -- pubspec.lock
      - uses: actions/upload-artifact@v6
        with:
          name: kunde-maps-android-unsigned-verification
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter test
      - run: flutter build ios --release --no-codesign --no-pub
        env:
          BYPASS_PERMISSION_LOCATION_ALWAYS: '1'
      - name: Verify native rendering on an available iPhone simulator
        env:
          BYPASS_PERMISSION_LOCATION_ALWAYS: '1'
        run: |
          simulator="$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next((x["udid"] for k in sorted(d, reverse=True) for x in d[k] if x["name"].startswith("iPhone")), ""))')"
          if [[ -z "$simulator" ]]; then
            echo "::warning::This runner has no available iPhone simulator"
            exit 0
          fi
          xcrun simctl boot "$simulator"
          xcrun simctl bootstatus "$simulator" -b
          flutter test -d "$simulator" integration_test/dev_smoke_test.dart --no-pub
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: google/osv-scanner-action/osv-scanner-action@v2.7.1
        with:
          scan-args: |-
            --lockfile=apps/mobile/pubspec.lock
            --format=table
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get --enforce-lockfile
        working-directory: apps/mobile
      - run: python3 apps/mobile/tool/check_licenses.py
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
