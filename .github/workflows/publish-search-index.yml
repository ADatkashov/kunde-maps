name: Publish Kazakhstan search index to R2
on:
  workflow_run:
    workflows: ['Build Kazakhstan search index']
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Successful Build Kazakhstan search index workflow run ID'
        required: true
        type: string
concurrency:
  group: publish-search-index
  cancel-in-progress: false
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify R2 configuration
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          test -n "$R2_ACCOUNT_ID"
          test -n "$R2_ACCESS_KEY_ID"
          test -n "$R2_SECRET_ACCESS_KEY"
      - name: Download index from successful build
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.run_id || github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          case "$RUN_ID" in *[!0-9]*|'') echo "Invalid run ID"; exit 1;; esac
          conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '.conclusion')"
          test "$conclusion" = success
          mkdir -p /tmp/kunde-search
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name kazakhstan-search-index --dir /tmp/kunde-search
          cd /tmp/kunde-search
          # The producer records an absolute /tmp/kunde-osm path; the artifact is
          # extracted to a different directory in this job. Verify by basename.
          expected="$(awk 'NR==1 {print $1}' index.sha256)"
          actual="$(sha256sum kazakhstan-search.sqlite3 | awk '{print $1}')"
          test -n "$expected" && test "$expected" = "$actual"
          python3 - <<'PY'
          import sqlite3
          db = sqlite3.connect('file:kazakhstan-search.sqlite3?mode=ro', uri=True)
          assert db.execute('PRAGMA quick_check').fetchone()[0] == 'ok'
          count = db.execute('SELECT count(*) FROM places').fetchone()[0]
          assert count > 1000, f'Unexpectedly small index: {count}'
          print('Verified search places:', count)
          db.close()
          PY
      - name: Publish immutable index to R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.run_id || github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          python3 -m pip install 'awscli>=1.35,<2'
          endpoint="https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          aws --endpoint-url "$endpoint" s3 cp /tmp/kunde-search/kazakhstan-search.sqlite3 \
            "s3://kunde-maps-tiles/search/kazakhstan-search-$RUN_ID.sqlite3" \
            --content-type application/vnd.sqlite3
          aws --endpoint-url "$endpoint" s3 cp /tmp/kunde-search/index.sha256 \
            "s3://kunde-maps-tiles/search/kazakhstan-search-$RUN_ID.sha256" \
            --content-type text/plain
          aws --endpoint-url "$endpoint" s3 cp /tmp/kunde-search/PROVENANCE.txt \
            "s3://kunde-maps-tiles/search/kazakhstan-search-$RUN_ID-PROVENANCE.txt" \
            --content-type text/plain
          remote_size="$(aws --endpoint-url "$endpoint" s3api head-object \
            --bucket kunde-maps-tiles \
            --key "search/kazakhstan-search-$RUN_ID.sqlite3" \
            --query ContentLength --output text)"
          local_size="$(stat -c '%s' /tmp/kunde-search/kazakhstan-search.sqlite3)"
          test "$remote_size" = "$local_size"
          aws --endpoint-url "$endpoint" s3api head-object \
            --bucket kunde-maps-tiles \
            --key "search/kazakhstan-search-$RUN_ID.sha256" >/dev/null
          echo "Verified R2 index checksum sidecar exists"
          echo "Verified R2 object size: $remote_size bytes"
          echo "Published immutable index and checksum: search/kazakhstan-search-$RUN_ID.sqlite3"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify anonymous public R2 download with the real provisioner
        env:
          RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.run_id || github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          base="https://pub-237f2a01acb04791aad25708c16f3d8a.r2.dev/search/kazakhstan-search-$RUN_ID"
          # Same code path as Render: custom User-Agent, SHA256 sidecar, quick_check, row count.
          # (Cloudflare answers the default Python-urllib User-Agent with 403 / error 1010.)
          MAPS_SEARCH_INDEX_URL="$base.sqlite3" MAPS_SEARCH_DB=/tmp/public-check/index.sqlite3 \
            python3 -I services/search/provision_index.py
          echo "Public R2 index verified end-to-end"
      - name: Publish verified search index as GitHub Release fallback
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.run_id || github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          tag="search-index-$RUN_ID"
          cp /tmp/kunde-search/index.sha256 "/tmp/kunde-search/kazakhstan-search-$RUN_ID.sha256"
          cp /tmp/kunde-search/kazakhstan-search.sqlite3 "/tmp/kunde-search/kazakhstan-search-$RUN_ID.sqlite3"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "Kazakhstan Search Index $RUN_ID" --notes "Verified OSM-derived search index and SHA256 for KUNDE Maps Search API."
          fi
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber \
            "/tmp/kunde-search/kazakhstan-search-$RUN_ID.sqlite3" \
            "/tmp/kunde-search/kazakhstan-search-$RUN_ID.sha256"
          echo "Release fallback ready: $tag"
