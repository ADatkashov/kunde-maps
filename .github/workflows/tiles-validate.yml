name: PMTiles archive validator
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate fixture and reject corruption
        run: |
          python3 - <<'PY'
          from pathlib import Path
          Path('/tmp/valid.pmtiles').write_bytes(b'PMTiles' + bytes([3]) + bytes(119) + b'payload')
          Path('/tmp/invalid.pmtiles').write_bytes(b'not-a-pmtiles')
          PY
          python3 scripts/verify-pmtiles.py /tmp/valid.pmtiles
          if python3 scripts/verify-pmtiles.py /tmp/invalid.pmtiles; then
            echo 'Validator accepted corrupt archive' >&2
            exit 1
          fi
