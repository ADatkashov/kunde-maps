name: Search index tests
on:
  push:
    paths:
      - 'services/search/**'
      - 'scripts/ci/**'
      - 'scripts/search-relevance.py'
      - 'scripts/check-places-index.py'
      - '.github/workflows/search-tests.yml'
  workflow_dispatch:
  pull_request:
    paths:
      - 'services/search/**'
      - 'scripts/ci/**'
      - 'scripts/search-relevance.py'
      - 'scripts/check-places-index.py'
      - '.github/workflows/search-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build isolated Search API container
        run: docker build -f infrastructure/search/Dockerfile -t kunde-maps-search:test .
      - name: Compile Python search modules
        run: python -m compileall -q services/search
      - name: Test search index and API modules
        run: python -m unittest discover -s services/search -p 'test_*.py' -v
      - name: Test OSM extract fetch script (Geofabrik fallback)
        run: python scripts/ci/test-fetch-osm-extract.py
