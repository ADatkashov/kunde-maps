name: Build Kazakhstan search index
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install OSM PBF parser
        run: python -m pip install 'osmium>=4,<5'
      - name: Download Kazakhstan OSM extract and checksum
        run: |
          set -euo pipefail
          mkdir -p /tmp/kunde-osm
          base=https://download.geofabrik.de/asia
          fetch() {  # fetch URL OUTPUT : diagnosable and retried on any transient error
            curl --fail --location --silent --show-error --retry 5 --retry-all-errors --retry-delay 15 \
              --write-out '%{http_code} %{size_download} bytes <- %{url_effective}\n' --output "$2" "$1"
          }
          echo "Redirect chain for the extract:"
          curl --silent --head --location --write-out 'final: %{http_code} %{url_effective}\n' --output /dev/null "$base/kazakhstan-latest.osm.pbf" || true
          fetch "$base/kazakhstan-latest.osm.pbf" /tmp/kunde-osm/kazakhstan.osm.pbf
          fetch "$base/kazakhstan-latest.osm.pbf.md5" /tmp/kunde-osm/kazakhstan.osm.pbf.md5
          cd /tmp/kunde-osm
          size="$(stat -c '%s' kazakhstan.osm.pbf)"
          test "$size" -gt 50000000 || { echo "Extract is only $size bytes (not a PBF):"; head -c 400 kazakhstan.osm.pbf; exit 1; }
          # Geofabrik checksum may use its upstream filename.
          expected="$(awk '{print $1}' kazakhstan.osm.pbf.md5)"
          actual="$(md5sum kazakhstan.osm.pbf | awk '{print $1}')"
          test "$expected" = "$actual"
          sha256sum kazakhstan.osm.pbf > source.sha256
      - name: Extract and index search points
        run: |
          set -euo pipefail
          python services/search/extract_osm.py /tmp/kunde-osm/kazakhstan.osm.pbf /tmp/kunde-osm/points.geojsonl
          python services/search/build_index.py /tmp/kunde-osm/points.geojsonl /tmp/kunde-osm/kazakhstan-search.sqlite3
          python -m unittest discover -s services/search -p 'test_*.py' -v
          # Quality gate: real Kazakhstan places must be found first (RU/KK/EN/translit). Blocks publishing bad indexes.
          python scripts/search-relevance.py --db /tmp/kunde-osm/kazakhstan-search.sqlite3 --min-top1 0.9
          sha256sum /tmp/kunde-osm/kazakhstan-search.sqlite3 > /tmp/kunde-osm/index.sha256
          printf 'Source: Geofabrik Kazakhstan OSM extract (ODbL)\n' > /tmp/kunde-osm/PROVENANCE.txt
          date -u '+Built UTC: %Y-%m-%dT%H:%M:%SZ' >> /tmp/kunde-osm/PROVENANCE.txt
          cat /tmp/kunde-osm/source.sha256 >> /tmp/kunde-osm/PROVENANCE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: kazakhstan-search-index
          path: |
            /tmp/kunde-osm/kazakhstan-search.sqlite3
            /tmp/kunde-osm/index.sha256
            /tmp/kunde-osm/PROVENANCE.txt
          retention-days: 3
          compression-level: 0
