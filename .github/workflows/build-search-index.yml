name: Build Kazakhstan search index
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install OSM PBF parser
        run: python -m pip install 'osmium>=4,<5'
      - name: Restore last verified OSM extract (fallback when Geofabrik is unreachable)
        uses: actions/cache/restore@v4
        with:
          path: /tmp/osm-cache
          key: osm-extract-none
          restore-keys: osm-extract-
      - name: Download Kazakhstan OSM extract and checksum
        env:
          OSM_CACHE_DIR: /tmp/osm-cache
        run: |
          set -euo pipefail
          sh scripts/ci/fetch-osm-extract.sh /tmp/kunde-osm
          cd /tmp/kunde-osm
          sha256sum kazakhstan.osm.pbf > source.sha256
      - name: Extract and index search points
        run: |
          set -euo pipefail
          python services/search/extract_osm.py /tmp/kunde-osm/kazakhstan.osm.pbf /tmp/kunde-osm/points.geojsonl
          python services/search/build_index.py /tmp/kunde-osm/points.geojsonl /tmp/kunde-osm/kazakhstan-search.sqlite3
          python -m unittest discover -s services/search -p 'test_*.py' -v
          # Quality gate: real Kazakhstan places must be found first (RU/KK/EN/translit). Blocks publishing bad indexes.
          python scripts/search-relevance.py --db /tmp/kunde-osm/kazakhstan-search.sqlite3 --min-top1 0.9
          # Places gate: every category populated, Almaty has real places (prints category counts and contact-data coverage).
          python scripts/check-places-index.py /tmp/kunde-osm/kazakhstan-search.sqlite3
          sha256sum /tmp/kunde-osm/kazakhstan-search.sqlite3 > /tmp/kunde-osm/index.sha256
          printf 'Source: Geofabrik Kazakhstan OSM extract (ODbL)\nSource URL: %s\nIndex schema: 2\n' "$(cat /tmp/kunde-osm/SOURCE_URL)" > /tmp/kunde-osm/PROVENANCE.txt
          date -u '+Built UTC: %Y-%m-%dT%H:%M:%SZ' >> /tmp/kunde-osm/PROVENANCE.txt
          cat /tmp/kunde-osm/source.sha256 >> /tmp/kunde-osm/PROVENANCE.txt
      - name: Save the verified extract for future builds
        if: success()
        uses: actions/cache/save@v4
        with:
          path: /tmp/osm-cache
          key: osm-extract-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: kazakhstan-search-index
          path: |
            /tmp/kunde-osm/kazakhstan-search.sqlite3
            /tmp/kunde-osm/index.sha256
            /tmp/kunde-osm/PROVENANCE.txt
          retention-days: 3
          compression-level: 0
