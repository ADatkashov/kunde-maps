name: format probe (temporary)
on:
  pull_request:
    paths:
      - '.github/workflows/format-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          cache: true
      - name: Print the file as dart format writes it
        working-directory: packages/kunde_maps_sdk
        run: |
          dart format --output=write test/picker_search_test.dart
          echo '=====BEGIN====='
          cat test/picker_search_test.dart
          echo '=====END====='
