name: format probe (temporary)
on:
  pull_request:
    paths:
      - '.github/workflows/format-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          cache: true
      - name: Print what dart format changes
        working-directory: packages/kunde_maps_sdk
        run: |
          dart format lib test
          echo '=====BEGIN====='
          git --no-pager diff --no-color -- .
          echo '=====END====='
