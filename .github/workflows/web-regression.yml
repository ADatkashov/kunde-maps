name: Web map regression checks
on:
  push:
    paths:
      - 'apps/web/**'
      - 'infrastructure/maps/**'
      - 'scripts/build-style.py'
      - 'scripts/test-style.py'
      - 'scripts/validate-style.mjs'
      - 'scripts/fixtures/**'
      - '.github/workflows/web-regression.yml'
  pull_request:
    paths:
      - 'apps/web/**'
      - 'infrastructure/maps/**'
      - 'scripts/build-style.py'
      - 'scripts/test-style.py'
      - 'scripts/validate-style.mjs'
      - 'scripts/fixtures/**'
      - '.github/workflows/web-regression.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: |
          node --check apps/web/map.js
          node --check apps/web/core.js
      - name: Unit-test web core (search client, i18n, hash links)
        run: node --test apps/web/test/*.test.js
      - name: Map styles are generated, consistent with the tile schema, and spec-valid
        run: |
          set -euo pipefail
          python3 scripts/build-style.py --check
          python3 scripts/test-style.py
          mkdir -p /tmp/stylespec && cp scripts/validate-style.mjs /tmp/stylespec/
          cd /tmp/stylespec
          npm init -y >/dev/null
          npm install --no-audit --no-fund @maplibre/maplibre-gl-style-spec@23
          node validate-style.mjs "$GITHUB_WORKSPACE/apps/web/style.json" "$GITHUB_WORKSPACE/apps/web/style-dark.json"
      - name: Validate map style and HTML references
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          style = json.loads(Path('apps/web/style.json').read_text())
          assert style.get('version') == 8
          assert 'kunde' in style.get('sources', {})
          html = Path('apps/web/index.html').read_text()
          assert 'map.js' in html and 'core.js' in html and 'ui.css' in html
          assert 'map-search' in html and 'search-results' in html
          print('Map static checks OK')
          PY
      - name: Validate POSIX startup scripts
        run: |
          sh -n infrastructure/maps/40-configure-tiles.sh
      - name: Verify runtime config output
        run: |
          set -eu
          sudo mkdir -p /srv/kunde-web
          sudo chown "$(id -u):$(id -g)" /srv/kunde-web
          MAPS_TILE_URL=https://example.com/kazakhstan.pmtiles sh infrastructure/maps/40-configure-tiles.sh
          python3 - <<'PY'
          import json
          with open('/srv/kunde-web/config.json') as f:
              data=json.load(f)
          assert data['styleUrl'] == '/style.json'
          assert data['tileUrl'] == 'https://example.com/kazakhstan.pmtiles'
          assert 'searchUrl' not in data
          print('Runtime config OK')
          PY
          MAPS_SEARCH_URL=https://search.example.com/ MAPS_TILE_URL=https://example.com/kazakhstan.pmtiles sh infrastructure/maps/40-configure-tiles.sh
          python3 - <<'PY'
          import json
          data=json.load(open('/srv/kunde-web/config.json'))
          assert data['searchUrl'] == 'https://search.example.com', data
          assert data['tileUrl'] == 'https://example.com/kazakhstan.pmtiles'
          print('Runtime config with search URL OK')
          PY
          for bad in 'http://search.example.com' 'https://x.example.com/path"x' 'https://x.example.com/a?b=1' 'javascript:alert(1)'; do
            if MAPS_SEARCH_URL="$bad" sh infrastructure/maps/40-configure-tiles.sh 2>/dev/null; then echo "accepted bad URL: $bad"; exit 1; fi
          done
          echo "Rejected invalid MAPS_SEARCH_URL values"
