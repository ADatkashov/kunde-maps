name: Android emulator DEV smoke

on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile-emulator.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dev-smoke:
    name: Android ${{ matrix.size }} · ${{ matrix.locale }} · ${{ matrix.theme }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {size: 360x800, locale: ru, theme: light}
          - {size: 390x844, locale: kk, theme: dark}
          - {size: 412x915, locale: en, theme: light}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          cache: true
      - run: flutter pub get --enforce-lockfile
        working-directory: apps/mobile
      - name: Enable KVM on the runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb shell wm size ${{ matrix.size }}
            adb shell wm density 160
            cd apps/mobile && flutter drive -d emulator-5554 --no-pub --driver=integration_test/screenshot_driver.dart --target=integration_test/dev_smoke_test.dart --dart-define=KUNDE_TEST_SCREENSHOTS=true --dart-define=KUNDE_TEST_LOCALE=${{ matrix.locale }} --dart-define=KUNDE_TEST_THEME=${{ matrix.theme }}
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: phase61-android-${{ matrix.size }}-${{ matrix.locale }}-${{ matrix.theme }}
          path: apps/mobile/build/phase61-screenshots/
          if-no-files-found: warn
