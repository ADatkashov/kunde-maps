name: Android emulator DEV smoke

on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile-emulator.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dev-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          cache: true
      - run: flutter pub get --enforce-lockfile
        working-directory: apps/mobile
      - name: Enable KVM on the runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: cd apps/mobile && flutter test -d emulator-5554 integration_test/dev_smoke_test.dart --no-pub
