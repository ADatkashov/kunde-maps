server {
  listen 80;
  server_name _;
  root /srv/kunde-web;
  index index.html;
  add_header X-Content-Type-Options nosniff always;
  location = /index.html {
    add_header Cache-Control "no-store, max-age=0" always;
    try_files $uri =404;
  }
  location = /map.js {
    add_header Cache-Control "no-store, max-age=0" always;
    try_files $uri =404;
  }
  location = /core.js {
    add_header Cache-Control "no-store, max-age=0" always;
    try_files $uri =404;
  }
  # Styles change with releases: always revalidate (ETag/Last-Modified) instead of heuristic caching.
  location ~ ^/style(-dark)?\.json$ {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }
  location = /ui.css {
    add_header Cache-Control "no-store, max-age=0" always;
    try_files $uri =404;
  }
  location / {
    try_files $uri $uri/ =404;
  }
  location /tiles/ {
    alias /srv/kunde-tiles/;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Accept-Ranges bytes always;
    types { application/octet-stream pmtiles; }
  }
}
