# Security headers (CSP built from the configured tile/search origins, see 40-configure-tiles.sh) live in a generated include.
# nginx does not inherit add_header into locations that define their own, so every location includes it explicitly.
# The wildcard makes the include optional (plain docker-compose runs without the entrypoint script).
server {
  listen 80;
  server_name _;
  root /srv/kunde-web;
  index index.html;
  include /etc/nginx/security-headers*.inc;
  location = /index.html {
    add_header Cache-Control "no-store, max-age=0" always;
    include /etc/nginx/security-headers*.inc;
    try_files $uri =404;
  }
  location = /map.js {
    add_header Cache-Control "no-store, max-age=0" always;
    include /etc/nginx/security-headers*.inc;
    try_files $uri =404;
  }
  location = /core.js {
    add_header Cache-Control "no-store, max-age=0" always;
    include /etc/nginx/security-headers*.inc;
    try_files $uri =404;
  }
  location = /theme-init.js {
    add_header Cache-Control "no-store, max-age=0" always;
    include /etc/nginx/security-headers*.inc;
    try_files $uri =404;
  }
  # Styles change with releases: always revalidate (ETag/Last-Modified) instead of heuristic caching.
  location ~ ^/style(-dark)?\.json$ {
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/security-headers*.inc;
    try_files $uri =404;
  }
  location = /ui.css {
    add_header Cache-Control "no-store, max-age=0" always;
    include /etc/nginx/security-headers*.inc;
    try_files $uri =404;
  }
  # Vendored, version-pinned libraries (see apps/web/vendor/README.md): cacheable but always revalidated.
  location /vendor/ {
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/security-headers*.inc;
    try_files $uri =404;
  }
  location / {
    try_files $uri $uri/ =404;
  }
  location /tiles/ {
    alias /srv/kunde-tiles/;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Accept-Ranges bytes always;
    include /etc/nginx/security-headers*.inc;
    types { application/octet-stream pmtiles; }
  }
}
