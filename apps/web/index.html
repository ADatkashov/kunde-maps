<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>KUNDE Maps — Алматы</title>
<link href="https://unpkg.com/maplibre-gl@5.9.0/dist/maplibre-gl.css" rel="stylesheet">
<link href="./ui.css" rel="stylesheet">
</head>
<body>
<main id="map" aria-label="Интерактивная карта Алматы"></main>
<div class="top-panel">
  <div class="brand"><span class="brand-mark">K</span><div><strong>KUNDE <span>Maps</span></strong><small>Алматы · Казахстан</small></div></div>
  <div class="top-actions"><button id="language" class="location-button lang-button" type="button" aria-label="Переключить язык подписей">ҚАЗ</button><button id="locate" class="location-button" type="button" aria-label="Показать моё местоположение" title="Моё местоположение">◎</button></div>
</div>
<div class="bottom-panel">
  <div id="selection" class="selection" hidden><strong id="selection-title">Выбранная точка</strong><span id="selection-coords"></span><button id="selection-close" type="button" aria-label="Закрыть карточку">✕</button></div>
  <div id="status" role="status" aria-live="polite">Загрузка карты…</div>
  <div id="coords" aria-label="Координаты центра карты"></div>
  <button id="copy-coords" type="button" aria-label="Скопировать координаты центра карты">Скопировать координаты</button>
</div>
<script src="https://unpkg.com/maplibre-gl@5.9.0/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/pmtiles@4.3.0/dist/pmtiles.js"></script>
<script src="./map.js"></script>
</body></html>
