<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)">
<title>KUNDE Maps — Алматы</title>
<link href="./vendor/maplibre-gl.css" rel="stylesheet">
<link href="./ui.css" rel="stylesheet">
<script src="./theme-init.js"></script>
</head>
<body>
<main id="map" aria-label="Интерактивная карта Алматы"></main>

<div class="rail">
  <div class="brand"><span class="brand-mark" aria-hidden="true">K</span><strong>KUNDE <span>Maps</span></strong></div>
  <form id="map-search" class="searchbox" role="search" autocomplete="off">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
    <label for="search-query" class="sr-only" id="search-label">Поиск на карте</label>
    <input id="search-query" type="search" name="q" maxlength="100" placeholder="Поиск места или адреса"
           role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="search-results"
           enterkeyhint="search" autocapitalize="off" spellcheck="false">
    <button id="search-clear" class="icon-button plain" type="button" aria-label="Очистить" hidden>
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </form>
  <div id="chips" class="chips" role="group" aria-label="Категории мест"></div>
  <section id="sheet" class="sheet" aria-label="Результаты" hidden>
    <button id="sheet-handle" class="sheet-handle" type="button" aria-expanded="true" aria-label="Развернуть или свернуть панель"><span></span></button>
    <div id="search-state" class="state" role="status" aria-live="polite" hidden></div>
    <ul id="search-results" class="results" role="listbox" aria-label="Результаты" hidden></ul>
    <div id="places-panel" class="panel-block" hidden>
      <div class="panel-head"><h2 id="places-title"></h2><button id="places-clear" class="btn small" type="button"></button></div>
      <div id="places-state" class="state" role="status" aria-live="polite" hidden></div>
      <ul id="places-list" class="results" aria-label="Места"></ul>
    </div>
    <div id="favorites-panel" class="panel-block" hidden>
      <div class="panel-head"><h2 id="favorites-title"></h2><button id="favorites-close" class="icon-button plain" type="button">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
      <p id="favorites-note" class="muted"></p>
      <ul id="favorites-list" class="results" aria-label="Сохранённые"></ul>
      <p id="favorites-empty" class="muted empty" hidden></p>
    </div>
    <div id="route-panel" class="panel-block route-panel" hidden>
      <div class="panel-head"><h2 id="route-title"></h2><button id="route-close" class="icon-button plain" type="button">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
      <div class="route-points">
        <div class="route-point"><span class="route-dot from" aria-hidden="true"></span><span class="route-label" id="route-from-label"></span><span id="route-from" class="route-value"></span><button id="route-pick" class="btn small" type="button"></button></div>
        <div class="route-point"><span class="route-dot to" aria-hidden="true"></span><span class="route-label" id="route-to-label"></span><span id="route-to" class="route-value"></span><button id="route-swap" class="btn small" type="button"></button></div>
      </div>
      <div id="route-modes" class="route-modes" role="group">
        <button class="mode" type="button" data-mode="car" aria-pressed="true"></button>
        <button class="mode" type="button" data-mode="foot" aria-pressed="false"></button>
        <button class="mode" type="button" data-mode="bike" aria-pressed="false"></button>
      </div>
      <div id="route-state" class="state" role="status" aria-live="polite" hidden></div>
      <div id="route-summary" class="route-summary" hidden><strong id="route-total"></strong><span id="route-narration" class="muted"></span></div>
      <ol id="route-steps" class="route-steps" aria-label="" hidden></ol>
      <p id="route-note" class="muted"></p>
      <a id="route-external" class="btn subtle route-external" target="_blank" rel="noopener noreferrer" hidden></a>
    </div>
    <article id="selection" class="place-card" hidden>
      <div class="place-head">
        <div class="place-title"><p id="selection-chip" class="cat-chip" hidden></p><h2 id="selection-title">Выбранная точка</h2><p id="selection-kind" class="place-kind"></p></div>
        <button id="selection-close" class="icon-button plain" type="button" aria-label="Закрыть">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <p id="selection-open" class="open-badge" hidden></p>
      <dl id="selection-details" class="details"></dl>
      <details id="selection-hours" class="hours" hidden><summary></summary><table><tbody></tbody></table></details>
      <p class="place-coords"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11Z"/><circle cx="12" cy="10" r="2.3"/></svg><span id="selection-coords"></span></p>
      <div class="place-actions">
        <a id="route-place" class="btn primary" target="_blank" rel="noopener noreferrer"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19 19 5M19 5h-8M19 5v8"/></svg><span></span></a>
        <button id="save-place" class="btn" type="button" aria-pressed="false"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3.5 2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.8 6.8 19.6l1-5.8-4.3-4.1 5.9-.9L12 3.5Z"/></svg><span></span></button>
        <button id="share-place" class="btn" type="button"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4m0 0L8 8m4-4 4 4M5 13v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg><span></span></button>
        <button id="copy-place" class="btn subtle" type="button"></button>
      </div>
    </article>
  </section>
</div>

<div class="controls" role="group" aria-label="Управление картой">
  <button id="language" class="icon-button" type="button" aria-label="Язык подписей" title="Язык подписей">RU</button>
  <button id="theme" class="icon-button" type="button" aria-label="Сменить тему" title="Сменить тему">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
  </button>
  <button id="favorites-btn" class="icon-button" type="button" aria-label="Сохранённые" title="Сохранённые" aria-pressed="false">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3.5 2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.8 6.8 19.6l1-5.8-4.3-4.1 5.9-.9L12 3.5Z"/></svg>
  </button>
  <button id="locate" class="icon-button" type="button" aria-label="Моё местоположение" title="Моё местоположение">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><circle cx="12" cy="12" r="7.5"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3"/></svg>
  </button>
</div>

<div class="map-meta">
  <div id="coords" aria-label="Координаты центра карты"></div>
  <button id="copy-coords" type="button" aria-label="Скопировать координаты центра карты">Копировать</button>
</div>
<div id="status" role="status" aria-live="polite">Загрузка карты…</div>

<script src="./vendor/maplibre-gl.js"></script>
<script src="./vendor/pmtiles.js"></script>
<script src="./core.js"></script>
<script src="./map.js"></script>
</body></html>
