name: maps
description: Native KUNDE Maps for Kazakhstan.
publish_to: none
version: 0.6.0+1

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.1"

dependencies:
  flutter:
    sdk: flutter
  flutter_tts: 4.2.5
  geolocator: 14.1.2
  http: ^1.6.0
  maplibre_gl: 0.28.0
  material_ui: ^1.1.0
  share_plus: ^13.0.0
  shared_preferences: ^2.5.4
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/style.json
    - assets/style-dark.json
